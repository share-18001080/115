          rm -f cross.txt
          echo "[binaries]" >> cross.txt
          echo "c = '$CC'" >> cross.txt
          echo "cpp = '$CXX'" >> cross.txt
          echo "ar = '$AR'" >> cross.txt
          echo "ranlib = '$RANLIB'" >> cross.txt
          echo "strip = '$STRIP'" >> cross.txt
          echo "pkgconfig = 'pkg-config'" >> cross.txt
          echo "" >> cross.txt
          echo "[properties]" >> cross.txt
          echo "cpp_args = ['-fPIC','-march=armv7-a','-mfpu=neon','-mfloat-abi=softfp']" >> cross.txt
          echo "cpp_link_args = ['-march=armv7-a','-mfpu=neon','-mfloat-abi=softfp']" >> cross.txt
          echo "" >> cross.txt
