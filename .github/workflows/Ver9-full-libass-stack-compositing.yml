          echo "system = 'android'" >> cross.txt
          echo "cpu_family = 'arm'" >> cross.txt
          echo "cpu = 'armv7'" >> cross.txt
          echo "endian = 'little'" >> cross.txt

          meson setup build \
            --buildtype=release \
            --prefix="$PREFIX" \
            --default-library=static \
            -Dresampler=libsamplerate \
            --cross-file cross.txt
          ninja -C build
