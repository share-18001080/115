          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DBROTLI_DISABLE_TESTS=ON \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            ../..
          retry_make
          make install
          cd ../../..

          echo "🎯 Building FreeType stage 1 (zlib + bzip2 + png + brotli, HarfBuzz OFF to break cycle)..."
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar xzf freetype-2.13.2.tar.gz
          cd freetype-2.13.2
          mkdir -p build-stage1 && cd build-stage1
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_PREFIX_PATH=$PREFIX \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_REQUIRE_ZLIB=TRUE \
            -DFT_REQUIRE_BZIP2=TRUE \
            -DFT_REQUIRE_PNG=TRUE \
            -DFT_REQUIRE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            ..
          retry_make
          make install
          cd ../..

          echo "🎯 Building HarfBuzz (CMake-first strategy, Android static)..."
          wget -q https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz || \
          wget -q https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.gz || {
            echo "⚠️ 14.2.0 not reachable, trying 10.4.0 fallback..."
            wget -q https://github.com/harfbuzz/harfbuzz/releases/download/10.4.0/harfbuzz-10.4.0.tar.xz
          }
          if [ -f "harfbuzz-14.2.0.tar.xz" ]; then
            tar xJf harfbuzz-14.2.0.tar.xz && HB_DIR=harfbuzz-14.2.0
          elif [ -f "harfbuzz-14.2.0.tar.gz" ]; then
            tar xzf harfbuzz-14.2.0.tar.gz && HB_DIR=harfbuzz-14.2.0
          elif [ -f "harfbuzz-10.4.0.tar.xz" ]; then
            tar xJf harfbuzz-10.4.0.tar.xz && HB_DIR=harfbuzz-10.4.0
          else
            echo "❌ HarfBuzz tarball download failed"; exit 1
          fi
          cd $HB_DIR
          mkdir -p build_cmake && cd build_cmake
          HB_CMAKE_OK=0
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DBUILD_SHARED_LIBS=OFF \
            -DHB_HAVE_FREETYPE=ON \
            -DHB_HAVE_GLIB=OFF \
            -DHB_HAVE_GOBJECT=OFF \
            -DHB_HAVE_ICU=OFF \
            -DHB_HAVE_GRAPHITE2=OFF \
            -DHB_HAVE_CORETEXT=OFF \
            -DHB_HAVE_UNISCRIBE=OFF \
            -DHB_HAVE_DIRECTWRITE=OFF \
            -DHB_BUILD_TESTS=OFF \
            -DHB_BUILD_UTILS=OFF \
            -DHB_BUILD_SUBSET=OFF \
            -DCMAKE_C_FLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS -Wno-unused-function -Wno-unused-parameter" \
            -DCMAKE_PREFIX_PATH=$PREFIX \
            -DFREETYPE_INCLUDE_DIRS=$PREFIX/include/freetype2 \
            -DFREETYPE_LIBRARY=$PREFIX/lib/libfreetype.a \
            .. && {
              if make -j$(nproc) V=1 2>&1 | tee cmake-build.log | tail -40; then
                if make install 2>/dev/null; then
                  HB_CMAKE_OK=1
                  echo "✅ HarfBuzz CMake build + install succeeded"
                else
                  echo "⚠️ CMake install failed, doing manual copy..."
                  find . -name "libharfbuzz.a" -exec cp {} $PREFIX/lib/ \;
                  mkdir -p $PREFIX/include/harfbuzz
                  cp ../src/hb*.h $PREFIX/include/harfbuzz/ 2>/dev/null || true
                  cp ../src/hb*.hh $PREFIX/include/harfbuzz/ 2>/dev/null || true
                  [ -f "$PREFIX/lib/libharfbuzz.a" ] && HB_CMAKE_OK=1
                fi
              fi
            }
          cd ..

          if [ $HB_CMAKE_OK -eq 0 ]; then
            echo "⚠️ CMake path failed, falling back to Meson with corrected cross-file..."
            rm -rf build-android
            write_android_cross_file android-armv7a-cross.txt
            meson setup build-android \
              --cross-file android-armv7a-cross.txt \
              --buildtype release \
              -Ddefault_library=static \
              -Dglib=disabled \
              -Dgobject=disabled \
              -Dcairo=disabled \
              -Dchafa=disabled \
              -Dicu=disabled \
              -Dgraphite2=disabled \
              -Dfreetype=enabled \
              -Dcoretext=disabled \
              -Dtests=disabled \
              -Ddocs=disabled \
              -Dutilities=disabled \
              -Dintrospection=disabled \
              -Dbenchmark=disabled
            meson compile -C build-android
            meson install -C build-android
          fi

          if [ -f "$PREFIX/lib/libharfbuzz.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/harfbuzz.pc" ]; then
            echo "🔧 Generating harfbuzz.pc manually..."
            HB_VER=$(echo $HB_DIR | sed 's/harfbuzz-//')
            {
              echo "prefix=$PREFIX"
              echo 'exec_prefix=${prefix}'
              echo 'libdir=${exec_prefix}/lib'
              echo 'includedir=${prefix}/include'
              echo ""
              echo "Name: harfbuzz"
              echo "Description: HarfBuzz text shaping library"
              echo "Version: $HB_VER"
              echo "Requires.private: freetype2"
              echo 'Libs: -L${libdir} -lharfbuzz'
              echo "Libs.private: -lm -lstdc++"
              echo 'Cflags: -I${includedir}/harfbuzz'
            } > $PREFIX/lib/pkgconfig/harfbuzz.pc
          fi
          if [ ! -f "$PREFIX/lib/libharfbuzz.a" ]; then
            echo "❌ HarfBuzz static library missing after both build attempts"; exit 1
          fi
          cd ..

          echo "🎯 Rebuilding FreeType stage 2 (turn HarfBuzz ON for full feature set)..."
          cd freetype-2.13.2
          rm -rf build-stage2
          mkdir -p build-stage2 && cd build-stage2
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_PREFIX_PATH=$PREFIX \
            -DFT_DYNAMIC_HARFBUZZ=FALSE \
            -DFT_REQUIRE_HARFBUZZ=TRUE \
            -DFT_REQUIRE_ZLIB=TRUE \
            -DFT_REQUIRE_BZIP2=TRUE \
            -DFT_REQUIRE_PNG=TRUE \
            -DFT_REQUIRE_BROTLI=TRUE \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            ..
          retry_make
          make install
          cd ../..

          echo "🎯 Building Expat (for Fontconfig XML backend)..."
          wget -q https://github.com/libexpat/libexpat/releases/download/R_2_7_3/expat-2.7.3.tar.xz
          tar xJf expat-2.7.3.tar.xz
          cd expat-2.7.3
          mkdir -p build-android && cd build-android
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_shared=OFF \
            -DBUILD_tools=OFF \
            -DBUILD_examples=OFF \
            -DBUILD_tests=OFF \
            -DEXPAT_BUILD_DOCS=OFF \
            -DEXPAT_BUILD_EXAMPLES=OFF \
            -DEXPAT_BUILD_TESTS=OFF \
            -DEXPAT_BUILD_TOOLS=OFF \
            ..
          retry_make
          make install
          cd ../..

          echo "🎯 Building libunibreak (Unicode line breaking for wrap_unicode)..."
          wget -q https://github.com/adah1972/libunibreak/releases/download/libunibreak_6_1/libunibreak-6.1.tar.gz
          tar xzf libunibreak-6.1.tar.gz
          cd libunibreak-6.1
          ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX \
            --disable-shared --enable-static --with-pic \
            CFLAGS="$CFLAGS" CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS"
          retry_make
          make install
          cd ..

          echo "🎯 Building Fontconfig static (professional font provider for libass)..."
          git clone --depth 1 --branch 2.17.1 https://github.com/arthenica/fontconfig.git fontconfig-2.17.1 || \
          git clone --depth 1 https://github.com/arthenica/fontconfig.git fontconfig-2.17.1
          cd fontconfig-2.17.1
          write_android_cross_file android-armv7a-fontconfig.ini
          meson setup build-android \
            --cross-file android-armv7a-fontconfig.ini \
            --buildtype release \
            --prefix=$PREFIX \
            --libdir=lib \
            --includedir=include \
            -Ddefault_library=static \
            -Ddoc=disabled \
            -Ddoc-txt=disabled \
            -Ddoc-man=disabled \
            -Ddoc-pdf=disabled \
            -Ddoc-html=disabled \
            -Dnls=disabled \
            -Dtests=disabled \
            -Dtools=disabled \
            -Dcache-build=disabled \
            -Diconv=disabled \
            -Dxml-backend=expat \
            -Dfontations=disabled \
            -Ddefault-hinting=full \
            -Ddefault-sub-pixel-rendering=none \
            -Dbitmap-conf=no-except-emoji
          meson compile -C build-android || { rm -rf build-android; meson setup build-android --cross-file android-armv7a-fontconfig.ini --buildtype release --prefix=$PREFIX --libdir=lib --includedir=include -Ddefault_library=static -Ddoc=disabled -Dnls=disabled -Dtests=disabled -Dtools=disabled -Dcache-build=disabled -Diconv=disabled -Dxml-backend=expat; meson compile -C build-android; }
          meson install -C build-android
          cd ..

          echo "Building libopenjpeg..."
          git clone --depth 1 https://github.com/uclouvain/openjpeg.git
          cd openjpeg
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=OFF ..
          retry_make
          make install
          cd ../..

      - name: Build LibASS (subtitle renderer)
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd external
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang++
          export AR=$TOOLCHAIN_PATH/bin/llvm-ar
          export RANLIB=$TOOLCHAIN_PATH/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN_PATH/bin/llvm-strip
          export SYSROOT=$TOOLCHAIN_PATH/sysroot
          export PREFIX=$(pwd)/../build/external
          export BUILD_HOST=x86_64-pc-linux-gnu
          export TARGET_HOST=arm-linux-androideabi
          export CFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -Os -ffunction-sections -fdata-sections -std=c99"
          export CXXFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -Os -ffunction-sections -fdata-sections -std=c++11"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -Wl,--gc-sections"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PATH=$TOOLCHAIN_PATH/bin:$PATH

          echo "🎯 Building LibASS v0.17.4 with full professional dependency stack..."
          for f in \
            "$PREFIX/lib/libfreetype.a" \
            "$PREFIX/lib/libfribidi.a" \
            "$PREFIX/lib/libharfbuzz.a" \
            "$PREFIX/lib/libfontconfig.a" \
            "$PREFIX/lib/libunibreak.a"; do
            [ -f "$f" ] || { echo "❌ Missing required dependency: $f"; exit 1; }
          done

          wget -q https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.gz || \
          wget -q https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz

          if [ -f "libass-0.17.4.tar.gz" ]; then
            tar xzf libass-0.17.4.tar.gz
          elif [ -f "libass-0.17.4.tar.xz" ]; then
            tar xJf libass-0.17.4.tar.xz
          else
            git clone --depth 1 --branch 0.17.4 https://github.com/libass/libass.git libass-0.17.4 || \
            git clone --depth 1 https://github.com/libass/libass.git libass-0.17.4
          fi
          cd libass-0.17.4

          if [ ! -f "configure" ] || [ ! -f "config.sub" ]; then
            ./autogen.sh 2>/dev/null || autoreconf -fiv
          fi
          wget -q -O config.sub 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub;hb=HEAD' 2>/dev/null || true
          wget -q -O config.guess 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess;hb=HEAD' 2>/dev/null || true
          chmod +x config.sub config.guess 2>/dev/null || true

          ./configure \
            --host=$TARGET_HOST \
            --build=$BUILD_HOST \
            --prefix=$PREFIX \
            --with-sysroot=$SYSROOT \
            --with-pic \
            --enable-static \
            --disable-shared \
            --disable-libtool-lock \
            --disable-fast-install \
            --disable-coretext \
            --disable-test \
            --disable-profile \
            --enable-asm \
            CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" || {
            echo "⚠️ Configure failed with ASM, retrying without ASM..."
            make distclean 2>/dev/null || true
            ./configure \
              --host=$TARGET_HOST \
              --build=$BUILD_HOST \
              --prefix=$PREFIX \
              --with-sysroot=$SYSROOT \
              --with-pic \
              --enable-static \
              --disable-shared \
              --disable-libtool-lock \
              --disable-fast-install \
              --disable-coretext \
              --disable-test \
              --disable-profile \
              --disable-asm \
              CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter" \
              CPPFLAGS="$CPPFLAGS" \
              LDFLAGS="$LDFLAGS"
          }

          if make -j$(nproc) V=1 2>&1 | tee build.log | tail -30; then
            echo "✅ LibASS parallel build succeeded"
          else
            echo "⚠️ Parallel build failed, trying single-threaded..."
            make clean
            make V=1 2>&1 | tee build-single.log | tail -30
          fi

          if make install 2>/dev/null; then
            echo "✅ LibASS installation successful"
          else
            echo "⚠️ Manual installation..."
            mkdir -p $PREFIX/lib $PREFIX/include/ass $PREFIX/lib/pkgconfig
            if [ -f "libass/.libs/libass.a" ]; then
              cp libass/.libs/libass.a $PREFIX/lib/
            elif find . -name "libass.a" -exec cp {} $PREFIX/lib/ \; 2>/dev/null; then
              true
            else
              echo "❌ libass.a not found after build"; exit 1
            fi
            cp libass/ass.h libass/ass_types.h $PREFIX/include/ass/ 2>/dev/null || true
            [ -f "libass.pc" ] && cp libass.pc $PREFIX/lib/pkgconfig/ || true
          fi

          if [ -f "$PREFIX/lib/libass.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/libass.pc" ]; then
            {
              echo "prefix=$PREFIX"
              echo "exec_prefix=\${prefix}"
              echo "libdir=\${exec_prefix}/lib"
              echo "includedir=\${prefix}/include"
              echo ""
              echo "Name: libass"
              echo "Description: Portable ASS/SSA subtitle renderer"
              echo "Version: 0.17.4"
              echo "Requires.private: freetype2 fribidi harfbuzz fontconfig libunibreak"
              echo "Libs: -L\${libdir} -lass"
              echo "Libs.private: -lm -lz -lbz2 -lpng16 -lbrotlidec -lbrotlicommon -lexpat"
              echo "Cflags: -I\${includedir}"
            } > $PREFIX/lib/pkgconfig/libass.pc
          fi

          [ -f "$PREFIX/lib/libass.a" ] || { echo "❌ LibASS build failed completely"; exit 1; }
          echo "✅ LibASS v0.17.4 successfully built with fontconfig + libunibreak + harfbuzz"
          ls -la $PREFIX/lib/libass.a
          cd ..

      - name: Create Library Status File
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          export PREFIX=$(pwd)/build/external
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          > $PREFIX/lib_status.env

          echo "# Critical Libraries Status (FIX POINT)" >> $PREFIX/lib_status.env
          echo "HAVE_SOXR=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBSAMPLERATE=false" >> $PREFIX/lib_status.env
          echo "HAVE_RUBBERBAND=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBASS=false" >> $PREFIX/lib_status.env
          echo "HAVE_FONTCONFIG=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBUNIBREAK=false" >> $PREFIX/lib_status.env

          [ -f "$PREFIX/lib/libsoxr.a" ] && [ -f "$PREFIX/lib/pkgconfig/soxr.pc" ] && echo "HAVE_SOXR=true" > $PREFIX/lib_status.env || echo "HAVE_SOXR=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libsamplerate.a" ] && [ -f "$PREFIX/lib/pkgconfig/libsamplerate.pc" ] && echo "HAVE_LIBSAMPLERATE=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBSAMPLERATE=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/librubberband.a" ] && [ -f "$PREFIX/lib/pkgconfig/rubberband.pc" ] && echo "HAVE_RUBBERBAND=true" >> $PREFIX/lib_status.env || echo "HAVE_RUBBERBAND=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libass.a" ] && [ -f "$PREFIX/lib/pkgconfig/libass.pc" ] && echo "HAVE_LIBASS=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBASS=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libfontconfig.a" ] && [ -f "$PREFIX/lib/pkgconfig/fontconfig.pc" ] && echo "HAVE_FONTCONFIG=true" >> $PREFIX/lib_status.env || echo "HAVE_FONTCONFIG=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libunibreak.a" ] && echo "HAVE_LIBUNIBREAK=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBUNIBREAK=false" >> $PREFIX/lib_status.env

          cat $PREFIX/lib_status.env
          echo "✅ Library status file created!"

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch ${{ env.FFMPEG_VERSION }} https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg
          echo "Applying Android compatibility patches..."
          sed -i 's/__builtin_assume_aligned//g' libavutil/mem.c || true
          sed -i 's/HAVE_BUILTIN_ASSUME_ALIGNED 1/HAVE_BUILTIN_ASSUME_ALIGNED 0/g' libavutil/mem.c || true
          find . -name "*.c" -exec sed -i 's/__restrict restrict//g' {} \; || true
          find . -name "*.h" -exec sed -i 's/__restrict restrict//g' {} \; || true

      - name: Create Build Directories
        run: |
          mkdir -p build/armeabi-v7a output/armeabi-v7a logs

      - name: Configure FFmpeg (n7.1 + ALL Features + LibSOXR + Rubberband - FIXED)
        working-directory: ffmpeg
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang++
          export STRIP=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-strip
          export AR=$TOOLCHAIN_PATH/bin/llvm-ar
          export RANLIB=$TOOLCHAIN_PATH/bin/llvm-ranlib
          export SYSROOT=$TOOLCHAIN_PATH/sysroot
          export PREFIX=$(pwd)/../build/external
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export CFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -O2 -I$PREFIX/include -std=c99"
          export CXXFLAGS="$CFLAGS -std=c++11"
          export LDFLAGS="-Wl,--fix-cortex-a8 -L$PREFIX/lib -L$SYSROOT/usr/lib"

          # READ library status file
          source $PREFIX/lib_status.env || echo "⚠️ lib_status.env not found, defaults to false"

          # Build enable flags dynamically from status
          ENABLE_LIBS=""
          EXTRA_LIBS="-lmp3lame -lx264 -lx265 -lvpx -lopus -lvorbis -logg -lwebp -lspeex -lopenjp2 -lfreetype -lz -lbz2 -llzma -lstdc++ -lm -ldl -llog"
          [ -f "$PREFIX/lib/libpng16.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lpng16"
          [ -f "$PREFIX/lib/libbrotlidec.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lbrotlidec -lbrotlicommon"
          [ -f "$PREFIX/lib/libexpat.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lexpat"

          # Check each library and build enable string
          [ -f "$PREFIX/lib/libgsm.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libgsm" && EXTRA_LIBS="$EXTRA_LIBS -lgsm"
          [ -f "$PREFIX/lib/libfribidi.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libfribidi" && EXTRA_LIBS="$EXTRA_LIBS -lfribidi"
          [ -f "$PREFIX/lib/libtheora.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libtheora" && EXTRA_LIBS="$EXTRA_LIBS -ltheora -ltheoraenc -ltheoradec"
          [ -f "$PREFIX/lib/libtwolame.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libtwolame" && EXTRA_LIBS="$EXTRA_LIBS -ltwolame"
          [ -f "$PREFIX/lib/libfdk-aac.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libfdk-aac" && EXTRA_LIBS="$EXTRA_LIBS -lfdk-aac"
          [ -f "$PREFIX/lib/libaom.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libaom" && EXTRA_LIBS="$EXTRA_LIBS -laom"

          # NEW FIX: Use lib_status.env to control NEW libraries
          if [ "$HAVE_SOXR" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-libsoxr"
            EXTRA_LIBS="$EXTRA_LIBS -lsoxr"
            echo "✅ LibSOXR enabled via status file"
          else
            echo "⚠️ LibSOXR disabled (not ready)"
          fi

          if [ "$HAVE_RUBBERBAND" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-librubberband --enable-filter=rubberband"
            EXTRA_LIBS="$EXTRA_LIBS -lrubberband -lsamplerate"
            echo "✅ Rubberband enabled via status file (with filter)"
          else
            echo "⚠️ Rubberband disabled (not ready)"
          fi

          if [ "$HAVE_LIBASS" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-libass"
            # libass static link path needs harfbuzz + professional subtitle deps
            EXTRA_LIBS="$EXTRA_LIBS -lass -lharfbuzz"
            [ "$HAVE_FONTCONFIG" = "true" ] && EXTRA_LIBS="$EXTRA_LIBS -lfontconfig"
            [ "$HAVE_LIBUNIBREAK" = "true" ] && EXTRA_LIBS="$EXTRA_LIBS -lunibreak"
            echo "✅ LibASS enabled via status file (subtitle renderer)"
          else
            echo "⚠️ LibASS disabled (not ready)"
          fi

          export EXTRA_LDFLAGS="-lc++_static -lc++abi $LDFLAGS"

          echo "🎯 Configuring FFmpeg n7.1 (FIXED: Status-driven libsoxr + rubberband)"
          echo "ENABLE_LIBS=$ENABLE_LIBS"
          echo "EXTRA_LIBS=$EXTRA_LIBS"

          ./configure \
            --prefix=../build/armeabi-v7a \
            --logfile=../logs/config.log \
            --arch=arm \
            --target-os=android \
            --enable-cross-compile \
            --cc=$CC \
            --cxx=$CXX \
            --strip=$STRIP \
            --ar=$AR \
            --ranlib=$RANLIB \
            --sysroot=$SYSROOT \
            --cpu=armv7-a \
            --extra-cflags="$CFLAGS -Wno-deprecated-declarations" \
            --extra-cxxflags="$CXXFLAGS" \
            --extra-ldflags="$EXTRA_LDFLAGS" \
            --extra-libs="$EXTRA_LIBS" \
            --pkg-config-flags="--static" \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-ffplay \
            --disable-doc \
            --disable-debug \
            --enable-optimizations \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-zlib \
            --enable-bzlib \
            --enable-lzma \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libvorbis \
            --enable-libwebp \
            --enable-libspeex \
            --enable-libopenjpeg \
            --enable-libfreetype \
            $ENABLE_LIBS

      - name: Build FFmpeg
        working-directory: ffmpeg
        run: |
          echo "🎯 Building FFmpeg n7.1 (COMPLETE: All codecs + LibSOXR + Rubberband filter)..."
          make -j$(nproc) V=1 2>&1 | tail -50
          make install
          cp ../build/armeabi-v7a/bin/ffmpeg ../output/armeabi-v7a/ || true
          cp ../build/armeabi-v7a/bin/ffprobe ../output/armeabi-v7a/ || true

      - name: Final Verification
        run: |
          echo "=== COMPLETE BUILD VERIFICATION (FFmpeg n7.1 + ALL Features + LibSOXR + Rubberband + Pro LibASS) ==="
          ls -lah output/armeabi-v7a/
          for binary in ffmpeg ffprobe; do
            if [ -f "output/armeabi-v7a/$binary" ]; then
              echo "✅ $binary: $(du -sh output/armeabi-v7a/$binary | cut -f1)"
              file output/armeabi-v7a/$binary
            else
              echo "❌ $binary: Not found"
            fi
          done
          mkdir -p release release/fonts release/fontconfig/conf.d release/examples
          cp -r output/armeabi-v7a/* release/ 2>/dev/null || echo "Binaries copied"

          download_font() {
            local url="$1"
            local out="$2"
            curl -L --retry 5 --retry-delay 2 --connect-timeout 20 -o "$out" "$url"
          }

          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf release/fonts/NotoSans-Regular.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf release/fonts/NotoSans-Bold.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Italic.ttf release/fonts/NotoSans-Italic.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSerif/NotoSerif-Regular.ttf release/fonts/NotoSerif-Regular.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansMono/NotoSansMono-Regular.ttf release/fonts/NotoSansMono-Regular.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf release/fonts/NotoSansArabic-Regular.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansHebrew/NotoSansHebrew-Regular.ttf release/fonts/NotoSansHebrew-Regular.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansThai/NotoSansThai-Regular.ttf release/fonts/NotoSansThai-Regular.ttf
          download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf release/fonts/NotoSansDevanagari-Regular.ttf

          cat > release/fontconfig/fonts.conf << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <description>Portable Fontconfig profile for FFmpeg + libass on Android</description>
            <dir>/system/fonts</dir>
            <dir>/product/fonts</dir>
            <dir>/vendor/fonts</dir>
            <dir>/data/local/tmp/ffmpeg-fonts</dir>
            <cachedir>/data/local/tmp/fontconfig-cache</cachedir>
            <config></config>
            <include ignore_missing="yes">conf.d</include>
          </fontconfig>
          EOF

          cat > release/examples/ANDROID_FONT_SETUP.txt << 'EOF'
          1) Push the bundled fonts to Android:
             adb shell mkdir -p /data/local/tmp/ffmpeg-fonts /data/local/tmp/fontconfig-cache
             adb push fonts /data/local/tmp/ffmpeg-fonts

          2) Point Fontconfig to the bundled profile before running ffmpeg:
             export FONTCONFIG_FILE=/data/local/tmp/ffmpeg-release/fontconfig/fonts.conf
             export FONTCONFIG_PATH=/data/local/tmp/ffmpeg-release/fontconfig

          3) Example burn-in command with Unicode line wrapping:
             ./ffmpeg -i input.mp4 -vf "subtitles=sub.ass:fontsdir=/data/local/tmp/ffmpeg-fonts:wrap_unicode=1" -c:a copy out.mp4
          EOF

          cat > release/BUILD_INFO.txt << 'EOF'
          FFmpeg n7.1 - Complete Build (ARMv7a, Static)
          Built with: LibSOXR, Rubberband Filter, LibASS (subtitle renderer), Fontconfig, Libunibreak
          LibASS stack: FreeType(zlib+bzip2+png+brotli+harfbuzz), FriBidi, HarfBuzz, Fontconfig, Expat, Libunibreak
          Bundle: Starter Noto font pack + portable Fontconfig profile
          Architecture: ARMv7a with NEON
          EOF

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n7.1-complete-libsoxr-rubberband-libass-pro-fontconfig-unibreak
          path: release/
          retention-days: 30

      - name: Complete Summary
        run: |
          echo "## 🎉 FFmpeg n7.1 COMPLETE Build SUCCESS (+ Professional LibASS Stack)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ NEW IN THIS BUILD:" >> $GITHUB_STEP_SUMMARY
          echo "- **LibASS v0.17.4**: Portable ASS/SSA subtitle renderer with Fontconfig + Libunibreak + HarfBuzz" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy**: FreeType stage1 -> HarfBuzz -> FreeType stage2 (relinked with HarfBuzz) -> Fontconfig + Libunibreak -> LibASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Library Status File**: lib_status.env tracks libsoxr + rubberband + libass availability" >> $GITHUB_STEP_SUMMARY
          echo "- **Status-Driven Configuration**: FFmpeg configure uses file status, not dynamic logic" >> $GITHUB_STEP_SUMMARY
          echo "- **Unified CONTRACT**: Build + Configure stages use same truth source" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 ALL FEATURES:" >> $GITHUB_STEP_SUMMARY
          echo "- **21+ External Libraries**: Fully static compilation" >> $GITHUB_STEP_SUMMARY
          echo "- **All Video Codecs**: H.264, H.265, VP8/9, AV1, Theora" >> $GITHUB_STEP_SUMMARY
          echo "- **All Audio Codecs**: AAC, MP3, MP2, Opus, Vorbis, Speex, GSM" >> $GITHUB_STEP_SUMMARY
          echo "- **Audio Processing**: LibSOXR + Rubberband filter (time-stretch, pitch-shift)" >> $GITHUB_STEP_SUMMARY
          echo "- **Subtitle Rendering**: LibASS + Fontconfig + Libunibreak + HarfBuzz + FreeType + FriBidi" >> $GITHUB_STEP_SUMMARY
          echo "- **Ready for Production**: ARMv7a optimized, NEON enabled, bundled starter font pack" >> $GITHUB_STEP_SUMMARY