          cd ..

          echo "🎯 Building HarfBuzz (Autotools-first Android strategy)..."
          wget -q https://github.com/harfbuzz/harfbuzz/releases/download/14.2.1/harfbuzz-14.2.1.tar.xz ||           wget -q https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz
          if [ -f "harfbuzz-14.2.1.tar.xz" ]; then
            tar xJf harfbuzz-14.2.1.tar.xz && HB_DIR=harfbuzz-14.2.1
          else
            tar xJf harfbuzz-14.2.0.tar.xz && HB_DIR=harfbuzz-14.2.0
          fi
          cd $HB_DIR
          NOCONFIGURE=1 ./autogen.sh || true
          ./configure             --host=$TARGET_HOST             --build=$BUILD_HOST             --prefix=$PREFIX             --with-pic             --with-sysroot=$SYSROOT             --with-glib=no             --with-freetype=yes             --enable-static             --disable-shared             --disable-fast-install             CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter"             CPPFLAGS="$CPPFLAGS -I$PREFIX/include/freetype2"             LDFLAGS="$LDFLAGS"
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install
          cp ./src/harfbuzz.pc $PREFIX/lib/pkgconfig/ 2>/dev/null || true
          rm -f $PREFIX/lib/*.la
          cd ..

          echo "Building fontconfig (system font provider for libass on Android)..."
          wget -q https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.17.1.tar.xz ||           wget -q https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.14.2.tar.xz -O fontconfig-2.17.1.tar.xz
          tar xJf fontconfig-2.17.1.tar.xz || { tar xJf fontconfig-2.14.2.tar.xz && mv fontconfig-2.14.2 fontconfig-2.17.1; }
          cd fontconfig-2.17.1
          sed -i 's|in "\$default_fonts"|in $default_fonts|g' configure.ac || true
          if [ -f "src/fccache.c" ]; then
            sed -i 's/(HAVE_POSIX_FADVISE)/(NO_HAVE_POSIX_FADVISE)/g' src/fccache.c || true
          fi
          [ -f configure ] || autoreconf -fiv
          ./configure             --host=$TARGET_HOST             --build=$BUILD_HOST             --prefix=$PREFIX             --with-pic             --with-expat=$PREFIX             --with-libiconv-prefix=$PREFIX             --without-libintl-prefix             --enable-static             --disable-shared             --disable-fast-install             --disable-rpath             --disable-libxml2             --disable-docs             CPPFLAGS="$CPPFLAGS -I$PREFIX/include -I$PREFIX/include/freetype2"             LDFLAGS="$LDFLAGS -L$PREFIX/lib"
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install
          if [ ! -f "$PREFIX/lib/pkgconfig/fontconfig.pc" ]; then
            cat > $PREFIX/lib/pkgconfig/fontconfig.pc <<EOF
prefix=$PREFIX
exec_prefix=\${prefix}
libdir=\${exec_prefix}/lib
includedir=\${prefix}/include
sysconfdir=\${prefix}/etc
localstatedir=\${prefix}/var
PACKAGE=fontconfig
confdir=\${sysconfdir}/fonts
cachedir=\${localstatedir}/cache/\${PACKAGE}

Name: Fontconfig
Description: Font configuration and customization library
Version: 2.17.1
Requires: freetype2 expat iconv
Libs: -L\${libdir} -lfontconfig
Cflags: -I\${includedir}
EOF
          fi
          cd ..

          echo "Building libunibreak (Unicode line breaking for ASS wrap_unicode)..."
          wget -q https://github.com/adah1972/libunibreak/releases/download/libunibreak_7_0/libunibreak-7.0.tar.gz ||           wget -q https://github.com/adah1972/libunibreak/archive/refs/tags/libunibreak_7_0.tar.gz -O libunibreak-7.0.tar.gz
          tar xzf libunibreak-7.0.tar.gz
          cd libunibreak-7.0 || cd libunibreak-libunibreak_7_0
          [ -f configure ] || autoreconf -fiv
          ./configure             --host=$TARGET_HOST             --build=$BUILD_HOST             --prefix=$PREFIX             --with-pic             --enable-static             --disable-shared             CFLAGS="$CFLAGS"             LDFLAGS="$LDFLAGS"
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install
          cd ..

          echo "Building libopenjpeg..."
          git clone --depth 1 https://github.com/uclouvain/openjpeg.git
          cd openjpeg
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=OFF ..
          make -j$(nproc)
          make install
          cd ../..

      - name: Build LibASS (subtitle renderer)
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          cd external
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang++
          export AR=$TOOLCHAIN_PATH/bin/llvm-ar
          export RANLIB=$TOOLCHAIN_PATH/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN_PATH/bin/llvm-strip
          export SYSROOT=$TOOLCHAIN_PATH/sysroot
          export PREFIX=$(pwd)/../build/external
          export BUILD_HOST=x86_64-pc-linux-gnu
          export TARGET_HOST=arm-linux-androideabi
          export CFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -Os -ffunction-sections -fdata-sections -std=c99"
          export CXXFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -Os -ffunction-sections -fdata-sections -std=c++11"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib -Wl,--gc-sections"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PATH=$TOOLCHAIN_PATH/bin:$PATH

          echo "🎯 Building LibASS v0.17.4 (with HarfBuzz, Android static)..."

          # Verify deps FIRST (fail fast strategy)
          if [ ! -f "$PREFIX/lib/libfreetype.a" ]; then
            echo "❌ FreeType missing - libass requires it"; exit 1
          fi
          if [ ! -f "$PREFIX/lib/libfribidi.a" ]; then
            echo "❌ FriBidi missing - libass requires it"; exit 1
          fi
          if [ ! -f "$PREFIX/lib/libharfbuzz.a" ]; then
            echo "❌ HarfBuzz missing - libass 0.17.4 requires it in this pipeline"; exit 1
          fi
          if [ ! -f "$PREFIX/lib/libfontconfig.a" ]; then
            echo "❌ Fontconfig missing - required for professional Android font discovery"; exit 1
          fi
          if [ ! -f "$PREFIX/lib/libunibreak.a" ]; then
            echo "❌ libunibreak missing - required for ASS_FEATURE_WRAP_UNICODE runtime support"; exit 1
          fi
          echo "✅ Dependencies verified: freetype + fribidi + harfbuzz + fontconfig + libunibreak present"

          # Use stable 0.17.4 tarball (released 2025-06-07) - PRODUCTION TESTED
          wget -q https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.gz || \
          wget -q https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz

          if [ -f "libass-0.17.4.tar.gz" ]; then
            tar xzf libass-0.17.4.tar.gz
          elif [ -f "libass-0.17.4.tar.xz" ]; then
            tar xJf libass-0.17.4.tar.xz
          else
            echo "⚠️ Tarball download failed, fallback to git clone v0.17.4..."
            git clone --depth 1 --branch 0.17.4 https://github.com/libass/libass.git libass-0.17.4 || \
            git clone --depth 1 https://github.com/libass/libass.git libass-0.17.4
          fi
          cd libass-0.17.4

          # Fix config.sub for arm-linux-androideabi (classic autoconf issue)
          if [ ! -f "configure" ] || [ ! -f "config.sub" ]; then
            echo "🔧 Running autoreconf..."
            ./autogen.sh 2>/dev/null || autoreconf -fiv
          fi
          # Override config.sub with up-to-date version (fixes androideabi recognition)
          wget -q -O config.sub 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub;hb=HEAD' 2>/dev/null || true
          wget -q -O config.guess 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess;hb=HEAD' 2>/dev/null || true
          chmod +x config.sub config.guess 2>/dev/null || true

          echo "🔧 Configuring libass (Android static, HarfBuzz + Fontconfig + libunibreak enabled)..."
          ./configure \
            --host=$TARGET_HOST \
            --build=$BUILD_HOST \
            --prefix=$PREFIX \
            --with-sysroot=$SYSROOT \
            --with-pic \
            --enable-static \
            --disable-shared \
            --disable-libtool-lock \
            --disable-fast-install \
            --enable-fontconfig \
            --enable-libunibreak \
            --disable-coretext \
            --disable-test \
            --disable-profile \
            --enable-asm \
            CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter" \
            CPPFLAGS="$CPPFLAGS -I$PREFIX/include/freetype2" \
            LDFLAGS="$LDFLAGS -L$PREFIX/lib" || {
            echo "⚠️ Configure failed with --enable-asm, retry with --disable-asm..."
            make distclean 2>/dev/null || true
            ./configure \
              --host=$TARGET_HOST \
              --build=$BUILD_HOST \
              --prefix=$PREFIX \
              --with-sysroot=$SYSROOT \
              --with-pic \
              --enable-static \
              --disable-shared \
              --disable-libtool-lock \
              --disable-fast-install \
              --enable-fontconfig \
              --enable-libunibreak \
              --disable-coretext \
              --disable-test \
              --disable-profile \
              --disable-asm \
              CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter" \
              CPPFLAGS="$CPPFLAGS -I$PREFIX/include/freetype2" \
              LDFLAGS="$LDFLAGS -L$PREFIX/lib"
          }

          echo "🔨 Compiling libass..."
          if make -j$(nproc) V=1 2>&1 | tee build.log | tail -30; then
            echo "✅ LibASS parallel build succeeded"
          else
            echo "⚠️ Parallel build failed, trying single-threaded..."
            make clean
            make V=1 2>&1 | tee build-single.log | tail -30 || echo "❌ LibASS build failed completely"
          fi

          # Install with fallback
          if make install 2>/dev/null; then
            echo "✅ LibASS installation successful"
          else
            echo "⚠️ Manual installation..."
            mkdir -p $PREFIX/lib $PREFIX/include/ass
            if [ -f "libass/.libs/libass.a" ]; then
              cp libass/.libs/libass.a $PREFIX/lib/ && echo "✅ Library copied"
            elif find . -name "libass.a" -exec cp {} $PREFIX/lib/ \; 2>/dev/null; then
              echo "✅ Library found and copied"
            fi
            cp libass/ass.h libass/ass_types.h $PREFIX/include/ass/ 2>/dev/null || true
            # Also create the pkgconfig manually if it wasn't installed
            if [ -f "libass.pc" ]; then
              cp libass.pc $PREFIX/lib/pkgconfig/ 2>/dev/null || true
            fi
          fi

          # Ensure pkgconfig file exists (insurance policy)
          if [ -f "$PREFIX/lib/libass.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/libass.pc" ]; then
            echo "🔧 Generating libass.pc manually..."
            echo "prefix=$PREFIX" > $PREFIX/lib/pkgconfig/libass.pc
            echo "exec_prefix=\${prefix}" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "libdir=\${exec_prefix}/lib" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "includedir=\${prefix}/include" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Name: libass" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Description: Portable ASS/SSA subtitle renderer" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Version: 0.17.4" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Requires.private: freetype2 fribidi harfbuzz fontconfig libunibreak expat iconv" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Libs: -L\${libdir} -lass" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Libs.private: -lm -lz -lexpat -liconv" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Cflags: -I\${includedir}" >> $PREFIX/lib/pkgconfig/libass.pc
          fi

          if [ -f "$PREFIX/lib/libass.a" ]; then
            echo "✅ LibASS v0.17.4 successfully built and configured!"
            ls -la $PREFIX/lib/libass.a
          else
            echo "❌ LibASS build failed completely"
          fi
          cd ..

      - name: Create Library Status File
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          export PREFIX=$(pwd)/build/external
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          > $PREFIX/lib_status.env

          echo "# Critical Libraries Status (FIX POINT)" >> $PREFIX/lib_status.env
          echo "HAVE_SOXR=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBSAMPLERATE=false" >> $PREFIX/lib_status.env
          echo "HAVE_RUBBERBAND=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBASS=false" >> $PREFIX/lib_status.env

          [ -f "$PREFIX/lib/libsoxr.a" ] && [ -f "$PREFIX/lib/pkgconfig/soxr.pc" ] && echo "HAVE_SOXR=true" > $PREFIX/lib_status.env || echo "HAVE_SOXR=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libsamplerate.a" ] && [ -f "$PREFIX/lib/pkgconfig/libsamplerate.pc" ] && echo "HAVE_LIBSAMPLERATE=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBSAMPLERATE=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/librubberband.a" ] && [ -f "$PREFIX/lib/pkgconfig/rubberband.pc" ] && echo "HAVE_RUBBERBAND=true" >> $PREFIX/lib_status.env || echo "HAVE_RUBBERBAND=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libass.a" ] && [ -f "$PREFIX/lib/pkgconfig/libass.pc" ] && echo "HAVE_LIBASS=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBASS=false" >> $PREFIX/lib_status.env

          cat $PREFIX/lib_status.env
          echo "✅ Library status file created!"

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch ${{ env.FFMPEG_VERSION }} https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg
          echo "Applying Android compatibility patches..."
          sed -i 's/__builtin_assume_aligned//g' libavutil/mem.c || true
          sed -i 's/HAVE_BUILTIN_ASSUME_ALIGNED 1/HAVE_BUILTIN_ASSUME_ALIGNED 0/g' libavutil/mem.c || true
          find . -name "*.c" -exec sed -i 's/__restrict restrict//g' {} \; || true
          find . -name "*.h" -exec sed -i 's/__restrict restrict//g' {} \; || true

      - name: Create Build Directories
        run: |
          mkdir -p build/armeabi-v7a output/armeabi-v7a logs

      - name: Configure FFmpeg (n7.1 + ALL Features + LibSOXR + Rubberband - FIXED)
        working-directory: ffmpeg
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang++
          export STRIP=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-strip
          export AR=$TOOLCHAIN_PATH/bin/llvm-ar
          export RANLIB=$TOOLCHAIN_PATH/bin/llvm-ranlib
          export SYSROOT=$TOOLCHAIN_PATH/sysroot
          export PREFIX=$(pwd)/../build/external
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export CFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -O2 -I$PREFIX/include -std=c99"
          export CXXFLAGS="$CFLAGS -std=c++11"
          export LDFLAGS="-Wl,--fix-cortex-a8 -L$PREFIX/lib -L$SYSROOT/usr/lib"

          # READ library status file
          source $PREFIX/lib_status.env || echo "⚠️ lib_status.env not found, defaults to false"

          # Build enable flags dynamically from status
          ENABLE_LIBS=""
          EXTRA_LIBS="-lmp3lame -lx264 -lx265 -lvpx -lopus -lvorbis -logg -lwebp -lspeex -lopenjp2 -lfreetype -lz -lbz2 -llzma -lstdc++ -lm -ldl -llog"

          # Check each library and build enable string
          [ -f "$PREFIX/lib/libgsm.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libgsm" && EXTRA_LIBS="$EXTRA_LIBS -lgsm"
          [ -f "$PREFIX/lib/libfribidi.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libfribidi" && EXTRA_LIBS="$EXTRA_LIBS -lfribidi"
          [ -f "$PREFIX/lib/libtheora.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libtheora" && EXTRA_LIBS="$EXTRA_LIBS -ltheora -ltheoraenc -ltheoradec"
          [ -f "$PREFIX/lib/libtwolame.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libtwolame" && EXTRA_LIBS="$EXTRA_LIBS -ltwolame"
          [ -f "$PREFIX/lib/libfdk-aac.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libfdk-aac" && EXTRA_LIBS="$EXTRA_LIBS -lfdk-aac"
          [ -f "$PREFIX/lib/libaom.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libaom" && EXTRA_LIBS="$EXTRA_LIBS -laom"

          # NEW FIX: Use lib_status.env to control NEW libraries
          if [ "$HAVE_SOXR" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-libsoxr"
            EXTRA_LIBS="$EXTRA_LIBS -lsoxr"
            echo "✅ LibSOXR enabled via status file"
          else
            echo "⚠️ LibSOXR disabled (not ready)"
          fi

          if [ "$HAVE_RUBBERBAND" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-librubberband --enable-filter=rubberband"
            EXTRA_LIBS="$EXTRA_LIBS -lrubberband -lsamplerate"
            echo "✅ Rubberband enabled via status file (with filter)"
          else
            echo "⚠️ Rubberband disabled (not ready)"
          fi

          if [ "$HAVE_LIBASS" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-libass"
            LIBASS_STATIC_LIBS=$(pkg-config --libs --static libass 2>/dev/null || echo "-lass -lfontconfig -lfreetype -lharfbuzz -lfribidi -lunibreak -lexpat -liconv")
            EXTRA_LIBS="$EXTRA_LIBS $LIBASS_STATIC_LIBS"
            echo "✅ LibASS enabled via status file (subtitle renderer + fontconfig + libunibreak)"
          else
            echo "⚠️ LibASS disabled (not ready)"
          fi

          export EXTRA_LDFLAGS="-lc++_static -lc++abi $LDFLAGS"

          echo "🎯 Configuring FFmpeg n7.1 (FIXED: Status-driven libsoxr + rubberband)"
          echo "ENABLE_LIBS=$ENABLE_LIBS"
          echo "EXTRA_LIBS=$EXTRA_LIBS"

          ./configure \
            --prefix=../build/armeabi-v7a \
            --logfile=../logs/config.log \
            --arch=arm \
            --target-os=android \
            --enable-cross-compile \
            --cc=$CC \
            --cxx=$CXX \
            --strip=$STRIP \
            --ar=$AR \
            --ranlib=$RANLIB \
            --sysroot=$SYSROOT \
            --cpu=armv7-a \
            --extra-cflags="$CFLAGS -Wno-deprecated-declarations" \
            --extra-cxxflags="$CXXFLAGS" \
            --extra-ldflags="$EXTRA_LDFLAGS" \
            --extra-libs="$EXTRA_LIBS" \
            --pkg-config-flags="--static" \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-ffplay \
            --disable-doc \
            --disable-debug \
            --enable-optimizations \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-zlib \
            --enable-bzlib \
            --enable-lzma \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libvorbis \
            --enable-libwebp \
            --enable-libspeex \
            --enable-libopenjpeg \
            --enable-libfreetype \
            $ENABLE_LIBS

      - name: Build FFmpeg
        working-directory: ffmpeg
        run: |
          echo "🎯 Building FFmpeg n7.1 (COMPLETE: All codecs + LibSOXR + Rubberband filter)..."
          make -j$(nproc) V=1 2>&1 | tail -50
          make install
          cp ../build/armeabi-v7a/bin/ffmpeg ../output/armeabi-v7a/ || true
          cp ../build/armeabi-v7a/bin/ffprobe ../output/armeabi-v7a/ || true

      - name: Final Verification
        run: |
          echo "=== COMPLETE BUILD VERIFICATION (FFmpeg n7.1 + ALL Features + LibSOXR + Rubberband) ==="
          ls -lah output/armeabi-v7a/
          for binary in ffmpeg ffprobe; do
            if [ -f "output/armeabi-v7a/$binary" ]; then
              echo "✅ $binary: $(du -sh output/armeabi-v7a/$binary | cut -f1)"
              file output/armeabi-v7a/$binary
            else
              echo "❌ $binary: Not found"
            fi
          done
          mkdir -p release
          cp -r output/armeabi-v7a/* release/ 2>/dev/null || echo "Binaries copied"
          cat > release/BUILD_INFO.txt << 'EOF'
          FFmpeg n7.1 - Complete Build (ARMv7a, Static)
          Built with: LibSOXR, Rubberband Filter, LibASS + Fontconfig + Libunibreak
          Architecture: ARMv7a with NEON
          EOF

      - name: Create LibASS Runtime Font Bundle
        run: |
          mkdir -p release/runtime-assets/fonts release/runtime-assets/fontconfig/conf.d release/runtime-assets/fontconfig/cache

          cat > release/runtime-assets/fontconfig/fonts.conf.template << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <dir>@@FONTDIR@@</dir>
            <cachedir>@@CACHEDIR@@</cachedir>
            <config></config>

            <match target="pattern">
              <test qual="any" name="family"><string>sans-serif</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>serif</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>monospace</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono</string></edit>
            </match>
          </fontconfig>
          EOF

          if [ "${{ env.BUNDLE_PRO_FONTS }}" = "1" ]; then
            download_font() {
              url="$1"; out="$2"
              curl -L --retry 5 --retry-delay 2 --fail "$url" -o "$out" || echo "⚠️ Font download failed: $url"
            }
            download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf release/runtime-assets/fonts/NotoSans-Regular.ttf
            download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf release/runtime-assets/fonts/NotoSans-Bold.ttf
            download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSerif/NotoSerif-Regular.ttf release/runtime-assets/fonts/NotoSerif-Regular.ttf
            download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansMono/NotoSansMono-Regular.ttf release/runtime-assets/fonts/NotoSansMono-Regular.ttf
            download_font https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf release/runtime-assets/fonts/NotoNaskhArabic-Regular.ttf
