            [ -f "srclib/.libs/libcharset.a" ] && cp srclib/.libs/libcharset.a $PREFIX/lib/ || true
            mkdir -p $PREFIX/include
            cp include/iconv.h $PREFIX/include/
          fi
          if [ -f "$PREFIX/lib/libiconv.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/libiconv.pc" ]; then
            cat > $PREFIX/lib/pkgconfig/libiconv.pc <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libiconv
          Description: GNU libiconv
          Version: 1.17
          Libs: -L\${libdir} -liconv
          Libs.private: -lcharset
          Cflags: -I\${includedir}
          EOF
          fi
          cd ..

          echo "Building expat (fontconfig XML parser)..."
          wget -q https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.xz ||           git clone --depth 1 https://github.com/libexpat/libexpat.git expat-git
          if [ -f "expat-2.6.2.tar.xz" ]; then
            tar xJf expat-2.6.2.tar.xz
            cd expat-2.6.2
            EXPAT_RETURN_DIR=..
          else
            cd expat-git/expat
            ./buildconf.sh || autoreconf -fiv
            EXPAT_RETURN_DIR=../..
          fi
          ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX             --disable-shared --enable-static --without-docbook
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install
          cd $EXPAT_RETURN_DIR

          echo "Building libuuid (fontconfig dependency for Android static builds)..."
          git clone --depth 1 https://github.com/util-linux/util-linux.git
          cd util-linux
          ./autogen.sh || autoreconf -fiv
          ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX             --disable-shared --enable-static --disable-all-programs             --enable-libuuid --disable-libblkid --disable-libmount --disable-libsmartcols             --disable-nls --without-python --without-systemd --without-systemdsystemunitdir             CFLAGS="$CFLAGS" CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS"
          if make -j$(nproc) V=1 libuuid 2>&1 | tee build.log; then
            echo "✅ libuuid compiled"
          else
            echo "⚠️ util-linux partial build fallback..."
            make V=1 libuuid || true
          fi
          make install || true
          mkdir -p $PREFIX/include/uuid
          find . -name "libuuid.a" -exec cp {} $PREFIX/lib/ \; 2>/dev/null || true
          [ -f "libuuid/src/uuid.h" ] && cp libuuid/src/uuid.h $PREFIX/include/uuid/uuid.h || true
          if [ -f "$PREFIX/lib/libuuid.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/uuid.pc" ]; then
            cat > $PREFIX/lib/pkgconfig/uuid.pc <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: uuid
          Description: Universally unique id library
          Version: 2.40.0
          Libs: -L\${libdir} -luuid
          Cflags: -I\${includedir}
          EOF
          fi
          cd ..

          echo "Building libunibreak (Unicode line breaking for libass)..."
          git clone --depth 1 https://github.com/adah1972/libunibreak.git
          cd libunibreak
          ./autogen.sh || autoreconf -fiv
          ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX             --disable-shared --enable-static
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install
          cd ..

          echo "Building freetype (expanded font support: zlib + bzip2 + png, with brotli fallback)..."
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar xzf freetype-2.13.2.tar.gz
          cd freetype-2.13.2
          if ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX             --disable-shared --enable-static             --with-zlib=yes --with-bzip2=yes --with-png=yes --with-brotli=yes             --with-harfbuzz=no             CPPFLAGS="$CPPFLAGS -I$PREFIX/include/freetype2"             LDFLAGS="$LDFLAGS"; then
            echo "✅ FreeType configured with Brotli support"
          else
            echo "⚠️ FreeType Brotli detection failed, retrying without Brotli to preserve overall build success..."
            make distclean 2>/dev/null || true
            ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX               --disable-shared --enable-static               --with-zlib=yes --with-bzip2=yes --with-png=yes --with-brotli=no               --with-harfbuzz=no               CPPFLAGS="$CPPFLAGS -I$PREFIX/include/freetype2"               LDFLAGS="$LDFLAGS"
          fi
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install
          cd ..

          echo "🎯 Building HarfBuzz (Meson-first because upstream documents Meson as primary build system; CMake fallback kept for resilience)..."
          wget -q https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz ||           wget -q https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.gz || {
            echo "⚠️ 14.2.0 not reachable, trying 10.4.0 fallback..."
            wget -q https://github.com/harfbuzz/harfbuzz/releases/download/10.4.0/harfbuzz-10.4.0.tar.xz
          }
          if [ -f "harfbuzz-14.2.0.tar.xz" ]; then
            tar xJf harfbuzz-14.2.0.tar.xz && HB_DIR=harfbuzz-14.2.0
          elif [ -f "harfbuzz-14.2.0.tar.gz" ]; then
            tar xzf harfbuzz-14.2.0.tar.gz && HB_DIR=harfbuzz-14.2.0
          elif [ -f "harfbuzz-10.4.0.tar.xz" ]; then
            tar xJf harfbuzz-10.4.0.tar.xz && HB_DIR=harfbuzz-10.4.0
          else
            echo "❌ HarfBuzz tarball download failed"; exit 1
          fi
          cd $HB_DIR
          echo "📦 Using source dir: $HB_DIR"

          HB_OK=0
          echo "🔨 [Attempt 1/2] Meson cross-build..."
          CFLAGS_ARR=$(printf "'%s', " $CFLAGS)
          CXXFLAGS_ARR=$(printf "'%s', " $CXXFLAGS)
          LDFLAGS_ARR=$(printf "'%s', " $LDFLAGS)
          {
            echo "[host_machine]"
            echo "system = 'android'"
            echo "cpu_family = 'arm'"
            echo "cpu = 'armv7'"
            echo "endian = 'little'"
            echo ""
            echo "[binaries]"
            echo "c = '$CC'"
            echo "cpp = '$CXX'"
            echo "ar = '$AR'"
            echo "strip = '$STRIP'"
            echo "ranlib = '$RANLIB'"
            echo "pkg-config = 'pkg-config'"
            echo ""
            echo "[properties]"
            echo "needs_exe_wrapper = true"
            echo "sys_root = '$SYSROOT'"
            echo "pkg_config_libdir = '$PREFIX/lib/pkgconfig'"
            echo ""
            echo "[built-in options]"
            echo "prefix = '$PREFIX'"
            echo "libdir = 'lib'"
            echo "includedir = 'include'"
            echo "default_library = 'static'"
            echo "c_args = [${CFLAGS_ARR}'-I$PREFIX/include','-I$PREFIX/include/freetype2']"
            echo "cpp_args = [${CXXFLAGS_ARR}'-I$PREFIX/include','-I$PREFIX/include/freetype2']"
            echo "c_link_args = [${LDFLAGS_ARR}'-L$PREFIX/lib']"
            echo "cpp_link_args = [${LDFLAGS_ARR}'-L$PREFIX/lib']"
          } > android-armv7a-cross.txt
          meson setup build-android             --cross-file android-armv7a-cross.txt             --buildtype release             -Ddefault_library=static             -Dglib=disabled             -Dgobject=disabled             -Dcairo=disabled             -Dchafa=disabled             -Dicu=disabled             -Dgraphite2=disabled             -Dfreetype=enabled             -Dcoretext=disabled             -Dtests=disabled             -Ddocs=disabled             -Dutilities=disabled             -Dintrospection=disabled             -Dbenchmark=disabled &&           meson compile -C build-android &&           meson install -C build-android && HB_OK=1 || true

          if [ $HB_OK -eq 0 ]; then
            echo "⚠️ Meson path failed, falling back to CMake..."
            mkdir -p build_cmake && cd build_cmake
            cmake -G "Unix Makefiles"               -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake               -DANDROID_ABI=armeabi-v7a               -DANDROID_PLATFORM=android-21               -DCMAKE_BUILD_TYPE=Release               -DCMAKE_INSTALL_PREFIX=$PREFIX               -DBUILD_SHARED_LIBS=OFF               -DHB_HAVE_FREETYPE=ON               -DHB_HAVE_GLIB=OFF               -DHB_HAVE_GOBJECT=OFF               -DHB_HAVE_ICU=OFF               -DHB_HAVE_GRAPHITE2=OFF               -DHB_HAVE_CORETEXT=OFF               -DHB_HAVE_UNISCRIBE=OFF               -DHB_HAVE_DIRECTWRITE=OFF               -DHB_BUILD_TESTS=OFF               -DHB_BUILD_UTILS=OFF               -DHB_BUILD_SUBSET=OFF               -DCMAKE_C_FLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter"               -DCMAKE_CXX_FLAGS="$CXXFLAGS -Wno-unused-function -Wno-unused-parameter"               -DCMAKE_PREFIX_PATH=$PREFIX               -DFREETYPE_INCLUDE_DIRS=$PREFIX/include/freetype2               -DFREETYPE_LIBRARY=$PREFIX/lib/libfreetype.a               .. && make -j$(nproc) V=1 && make install && HB_OK=1 || true
            cd ..
          fi

          if [ -f "$PREFIX/lib/libharfbuzz.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/harfbuzz.pc" ]; then
            echo "🔧 Generating harfbuzz.pc manually..."
            HB_VER=$(echo $HB_DIR | sed 's/harfbuzz-//')
            {
              echo "prefix=$PREFIX"
              echo 'exec_prefix=${prefix}'
              echo 'libdir=${exec_prefix}/lib'
              echo 'includedir=${prefix}/include'
              echo ""
              echo "Name: harfbuzz"
              echo "Description: HarfBuzz text shaping library"
              echo "Version: $HB_VER"
              echo "Requires.private: freetype2"
              echo 'Libs: -L${libdir} -lharfbuzz'
              echo "Libs.private: -lm -lstdc++"
              echo 'Cflags: -I${includedir}/harfbuzz'
            } > $PREFIX/lib/pkgconfig/harfbuzz.pc
          fi
          if [ ! -f "$PREFIX/lib/libharfbuzz.a" ]; then
            echo "❌ HarfBuzz static library missing after both build attempts"; exit 1
          fi
          echo "✅ HarfBuzz successfully built: $(ls -lh $PREFIX/lib/libharfbuzz.a)"
          cd ..

          echo "Building fontconfig (system font provider for professional libass builds)..."
          git clone --depth 1 https://gitlab.freedesktop.org/fontconfig/fontconfig.git ||           git clone --depth 1 https://github.com/arthenica/fontconfig.git fontconfig
          cd fontconfig
          NOCONFIGURE=1 ./autogen.sh 2>/dev/null || autoreconf -fiv
          ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX             --sysconfdir=$PREFIX/etc --localstatedir=$PREFIX/var             --disable-shared --enable-static --disable-docs --disable-nls             --with-expat=$PREFIX --with-libiconv-prefix=$PREFIX             --with-add-fonts=/system/fonts,/vendor/fonts             CPPFLAGS="$CPPFLAGS -I$PREFIX/include -I$PREFIX/include/freetype2"             LDFLAGS="$LDFLAGS" || {
              echo "⚠️ fontconfig configure failed, retrying with libxml2 disabled explicitly..."
              make distclean 2>/dev/null || true
              ./configure --host=$TARGET_HOST --build=$BUILD_HOST --prefix=$PREFIX                 --sysconfdir=$PREFIX/etc --localstatedir=$PREFIX/var                 --disable-shared --enable-static --disable-docs --disable-nls --disable-libxml2                 --with-expat=$PREFIX --with-libiconv-prefix=$PREFIX                 --with-add-fonts=/system/fonts,/vendor/fonts                 CPPFLAGS="$CPPFLAGS -I$PREFIX/include -I$PREFIX/include/freetype2"                 LDFLAGS="$LDFLAGS"
            }
          make -j$(nproc) V=1 || { make clean; make V=1; }
          make install || true
          if [ -f "src/.libs/libfontconfig.a" ] && [ ! -f "$PREFIX/lib/libfontconfig.a" ]; then
            cp src/.libs/libfontconfig.a $PREFIX/lib/
            mkdir -p $PREFIX/include/fontconfig
            cp fontconfig/fontconfig.h $PREFIX/include/fontconfig/ 2>/dev/null || true
            cp fontconfig/*.h $PREFIX/include/fontconfig/ 2>/dev/null || true
          fi
          if [ -f "$PREFIX/lib/libfontconfig.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/fontconfig.pc" ]; then
            cat > $PREFIX/lib/pkgconfig/fontconfig.pc <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include
          sysconfdir=\${prefix}/etc
          localstatedir=\${prefix}/var

          Name: Fontconfig
          Description: Font configuration and customization library
          Version: 2.15.0
          Requires: freetype2 uuid expat libiconv
          Libs: -L\${libdir} -lfontconfig
          Cflags: -I\${includedir}
          EOF
          fi
          if [ ! -f "$PREFIX/lib/libfontconfig.a" ]; then
            echo "❌ fontconfig static library missing"; exit 1
          fi
          mkdir -p $PREFIX/etc/fonts/conf.d $PREFIX/var/cache/fontconfig
          cat > $PREFIX/etc/fonts/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <dir>/system/fonts</dir>
            <dir>/vendor/fonts</dir>
            <cachedir>/data/local/tmp/fontconfig-cache</cachedir>
            <config></config>
          </fontconfig>
          EOF
          cd ..

          echo "Building libopenjpeg..."
          git clone --depth 1 https://github.com/uclouvain/openjpeg.git
          cd openjpeg
          mkdir build && cd build
          cmake -G "Unix Makefiles"             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake             -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX             -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=OFF ..
          make -j$(nproc)
          make install
          cd ../..


      - name: Build LibASS (subtitle renderer)
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          cd external
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang++
          export AR=$TOOLCHAIN_PATH/bin/llvm-ar
          export RANLIB=$TOOLCHAIN_PATH/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN_PATH/bin/llvm-strip
          export SYSROOT=$TOOLCHAIN_PATH/sysroot
          export PREFIX=$(pwd)/../build/external
          export BUILD_HOST=x86_64-pc-linux-gnu
          export TARGET_HOST=arm-linux-androideabi
          export CFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -Os -ffunction-sections -fdata-sections -std=c99"
          export CXXFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -Os -ffunction-sections -fdata-sections -std=c++11"
          export CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/freetype2"
          export LDFLAGS="-L$PREFIX/lib -Wl,--gc-sections"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PATH=$TOOLCHAIN_PATH/bin:$PATH
          export PKG_CONFIG="pkg-config --static"

          echo "🎯 Building LibASS v0.17.4 (full Android stack: HarfBuzz + Fontconfig + FriBidi + libunibreak)..."

          for req in libfreetype.a libfribidi.a libharfbuzz.a libfontconfig.a libunibreak.a libexpat.a libuuid.a; do
            if [ ! -f "$PREFIX/lib/$req" ]; then
              echo "❌ Missing dependency: $req"; exit 1
            fi
          done
          echo "✅ Dependencies verified: freetype + fribidi + harfbuzz + fontconfig + libunibreak"

          wget -q https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.gz ||           wget -q https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
          if [ -f "libass-0.17.4.tar.gz" ]; then
            tar xzf libass-0.17.4.tar.gz
          elif [ -f "libass-0.17.4.tar.xz" ]; then
            tar xJf libass-0.17.4.tar.xz
          else
            echo "⚠️ Tarball download failed, fallback to git clone v0.17.4..."
            git clone --depth 1 --branch 0.17.4 https://github.com/libass/libass.git libass-0.17.4 ||             git clone --depth 1 https://github.com/libass/libass.git libass-0.17.4
          fi
          cd libass-0.17.4

          if [ ! -f "configure" ] || [ ! -f "config.sub" ]; then
            echo "🔧 Running autoreconf..."
            ./autogen.sh 2>/dev/null || autoreconf -fiv
          fi
          wget -q -O config.sub 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.sub;hb=HEAD' 2>/dev/null || true
          wget -q -O config.guess 'https://git.savannah.gnu.org/gitweb/?p=config.git;a=blob_plain;f=config.guess;hb=HEAD' 2>/dev/null || true
          chmod +x config.sub config.guess 2>/dev/null || true

          echo "🔧 Configuring libass (fontconfig + libunibreak enabled)..."
          ./configure             --host=$TARGET_HOST             --build=$BUILD_HOST             --prefix=$PREFIX             --with-sysroot=$SYSROOT             --with-pic             --enable-static             --disable-shared             --disable-libtool-lock             --disable-fast-install             --enable-fontconfig             --enable-require-system-font-provider             --disable-coretext             --disable-directwrite             --disable-test             --disable-profile             --enable-asm             CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter"             CPPFLAGS="$CPPFLAGS"             LDFLAGS="$LDFLAGS" || {
              echo "⚠️ Configure failed with ASM enabled, retrying with ASM disabled..."
              make distclean 2>/dev/null || true
              ./configure                 --host=$TARGET_HOST                 --build=$BUILD_HOST                 --prefix=$PREFIX                 --with-sysroot=$SYSROOT                 --with-pic                 --enable-static                 --disable-shared                 --disable-libtool-lock                 --disable-fast-install                 --enable-fontconfig                 --enable-require-system-font-provider                 --disable-coretext                 --disable-directwrite                 --disable-test                 --disable-profile                 --disable-asm                 CFLAGS="$CFLAGS -Wno-unused-function -Wno-unused-parameter"                 CPPFLAGS="$CPPFLAGS"                 LDFLAGS="$LDFLAGS"
            }

          echo "🔨 Compiling libass..."
          if make -j$(nproc) V=1 2>&1 | tee build.log | tail -30; then
            echo "✅ LibASS parallel build succeeded"
          else
            echo "⚠️ Parallel build failed, trying single-threaded..."
            make clean
            make V=1 2>&1 | tee build-single.log | tail -30 || echo "❌ LibASS build failed completely"
          fi

          if make install 2>/dev/null; then
            echo "✅ LibASS installation successful"
          else
            echo "⚠️ Manual installation..."
            mkdir -p $PREFIX/lib $PREFIX/include/ass
            if [ -f "libass/.libs/libass.a" ]; then
              cp libass/.libs/libass.a $PREFIX/lib/ && echo "✅ Library copied"
            elif find . -name "libass.a" -exec cp {} $PREFIX/lib/ \; 2>/dev/null; then
              echo "✅ Library found and copied"
            fi
            cp libass/ass.h libass/ass_types.h $PREFIX/include/ass/ 2>/dev/null || true
            if [ -f "libass.pc" ]; then
              cp libass.pc $PREFIX/lib/pkgconfig/ 2>/dev/null || true
            fi
          fi

          if [ -f "$PREFIX/lib/libass.a" ] && [ ! -f "$PREFIX/lib/pkgconfig/libass.pc" ]; then
            echo "🔧 Generating libass.pc manually..."
            echo "prefix=$PREFIX" > $PREFIX/lib/pkgconfig/libass.pc
            echo "exec_prefix=\${prefix}" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "libdir=\${exec_prefix}/lib" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "includedir=\${prefix}/include" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Name: libass" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Description: Portable ASS/SSA subtitle renderer" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Version: 0.17.4" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Requires.private: freetype2 fribidi harfbuzz fontconfig libunibreak" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Libs: -L\${libdir} -lass" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Libs.private: -lm -lz" >> $PREFIX/lib/pkgconfig/libass.pc
            echo "Cflags: -I\${includedir}" >> $PREFIX/lib/pkgconfig/libass.pc
          fi

          if [ ! -f "$PREFIX/lib/libass.a" ]; then
            echo "❌ LibASS build failed completely"; exit 1
          fi
          if ! grep -q 'fontconfig' "$PREFIX/lib/pkgconfig/libass.pc"; then
            echo "❌ libass.pc does not expose fontconfig dependency as expected"; exit 1
          fi
          if ! grep -q 'libunibreak' "$PREFIX/lib/pkgconfig/libass.pc"; then
            echo "❌ libass.pc does not expose libunibreak dependency as expected"; exit 1
          fi
          echo "✅ LibASS v0.17.4 successfully built with full font stack"
          ls -la $PREFIX/lib/libass.a
          cd ..

      - name: Create Library Status File
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          export PREFIX=$(pwd)/build/external
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          > $PREFIX/lib_status.env

          echo "# Critical Libraries Status (FIX POINT)" >> $PREFIX/lib_status.env
          echo "HAVE_SOXR=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBSAMPLERATE=false" >> $PREFIX/lib_status.env
          echo "HAVE_RUBBERBAND=false" >> $PREFIX/lib_status.env
          echo "HAVE_LIBASS=false" >> $PREFIX/lib_status.env

          [ -f "$PREFIX/lib/libsoxr.a" ] && [ -f "$PREFIX/lib/pkgconfig/soxr.pc" ] && echo "HAVE_SOXR=true" > $PREFIX/lib_status.env || echo "HAVE_SOXR=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libsamplerate.a" ] && [ -f "$PREFIX/lib/pkgconfig/libsamplerate.pc" ] && echo "HAVE_LIBSAMPLERATE=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBSAMPLERATE=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/librubberband.a" ] && [ -f "$PREFIX/lib/pkgconfig/rubberband.pc" ] && echo "HAVE_RUBBERBAND=true" >> $PREFIX/lib_status.env || echo "HAVE_RUBBERBAND=false" >> $PREFIX/lib_status.env
          [ -f "$PREFIX/lib/libass.a" ] && [ -f "$PREFIX/lib/pkgconfig/libass.pc" ] && echo "HAVE_LIBASS=true" >> $PREFIX/lib_status.env || echo "HAVE_LIBASS=false" >> $PREFIX/lib_status.env

          cat $PREFIX/lib_status.env
          echo "✅ Library status file created!"

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch ${{ env.FFMPEG_VERSION }} https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg
          echo "Applying Android compatibility patches..."
          sed -i 's/__builtin_assume_aligned//g' libavutil/mem.c || true
          sed -i 's/HAVE_BUILTIN_ASSUME_ALIGNED 1/HAVE_BUILTIN_ASSUME_ALIGNED 0/g' libavutil/mem.c || true
          find . -name "*.c" -exec sed -i 's/__restrict restrict//g' {} \; || true
          find . -name "*.h" -exec sed -i 's/__restrict restrict//g' {} \; || true

      - name: Create Build Directories
        run: |
          mkdir -p build/armeabi-v7a output/armeabi-v7a logs

      - name: Configure FFmpeg (n7.1 + ALL Features + LibSOXR + Rubberband - FIXED)
        working-directory: ffmpeg
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export TOOLCHAIN_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang
          export CXX=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-clang++
          export STRIP=$TOOLCHAIN_PATH/bin/armv7a-linux-androideabi21-strip
          export AR=$TOOLCHAIN_PATH/bin/llvm-ar
          export RANLIB=$TOOLCHAIN_PATH/bin/llvm-ranlib
          export SYSROOT=$TOOLCHAIN_PATH/sysroot
          export PREFIX=$(pwd)/../build/external
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export CFLAGS="-fPIC -DANDROID -march=armv7-a -mfloat-abi=softfp -mfpu=neon -mthumb -O2 -I$PREFIX/include -std=c99"
          export CXXFLAGS="$CFLAGS -std=c++11"
          export LDFLAGS="-Wl,--fix-cortex-a8 -L$PREFIX/lib -L$SYSROOT/usr/lib"

          # READ library status file
          source $PREFIX/lib_status.env || echo "⚠️ lib_status.env not found, defaults to false"

          # Build enable flags dynamically from status
          ENABLE_LIBS=""
          EXTRA_LIBS="-lmp3lame -lx264 -lx265 -lvpx -lopus -lvorbis -logg -lwebp -lspeex -lopenjp2 -lfreetype -lz -lbz2 -llzma -lstdc++ -lm -ldl -llog"
          [ -f "$PREFIX/lib/libpng16.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lpng16"
          [ -f "$PREFIX/lib/libbrotlidec.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lbrotlidec -lbrotlicommon"
          [ -f "$PREFIX/lib/libiconv.a" ] && EXTRA_LIBS="$EXTRA_LIBS -liconv"
          [ -f "$PREFIX/lib/libcharset.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lcharset"
          [ -f "$PREFIX/lib/libexpat.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lexpat"
          [ -f "$PREFIX/lib/libuuid.a" ] && EXTRA_LIBS="$EXTRA_LIBS -luuid"
          [ -f "$PREFIX/lib/libfontconfig.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lfontconfig"
          [ -f "$PREFIX/lib/libunibreak.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lunibreak"

          # Check each library and build enable string
          [ -f "$PREFIX/lib/libgsm.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libgsm" && EXTRA_LIBS="$EXTRA_LIBS -lgsm"
          [ -f "$PREFIX/lib/libfribidi.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libfribidi" && EXTRA_LIBS="$EXTRA_LIBS -lfribidi"
          [ -f "$PREFIX/lib/libtheora.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libtheora" && EXTRA_LIBS="$EXTRA_LIBS -ltheora -ltheoraenc -ltheoradec"
          [ -f "$PREFIX/lib/libtwolame.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libtwolame" && EXTRA_LIBS="$EXTRA_LIBS -ltwolame"
          [ -f "$PREFIX/lib/libfdk-aac.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libfdk-aac" && EXTRA_LIBS="$EXTRA_LIBS -lfdk-aac"
          [ -f "$PREFIX/lib/libaom.a" ] && ENABLE_LIBS="$ENABLE_LIBS --enable-libaom" && EXTRA_LIBS="$EXTRA_LIBS -laom"

          # NEW FIX: Use lib_status.env to control NEW libraries
          if [ "$HAVE_SOXR" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-libsoxr"
            EXTRA_LIBS="$EXTRA_LIBS -lsoxr"
            echo "✅ LibSOXR enabled via status file"
          else
            echo "⚠️ LibSOXR disabled (not ready)"
          fi

          if [ "$HAVE_RUBBERBAND" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-librubberband --enable-filter=rubberband"
            EXTRA_LIBS="$EXTRA_LIBS -lrubberband -lsamplerate"
            echo "✅ Rubberband enabled via status file (with filter)"
          else
            echo "⚠️ Rubberband disabled (not ready)"
          fi

          if [ "$HAVE_LIBASS" = "true" ]; then
            ENABLE_LIBS="$ENABLE_LIBS --enable-libass"
            EXTRA_LIBS="$EXTRA_LIBS -lass -lharfbuzz -lfreetype -lfribidi"
            [ -f "$PREFIX/lib/libfontconfig.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lfontconfig"
            [ -f "$PREFIX/lib/libunibreak.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lunibreak"
            [ -f "$PREFIX/lib/libexpat.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lexpat"
            [ -f "$PREFIX/lib/libuuid.a" ] && EXTRA_LIBS="$EXTRA_LIBS -luuid"
            [ -f "$PREFIX/lib/libiconv.a" ] && EXTRA_LIBS="$EXTRA_LIBS -liconv"
            [ -f "$PREFIX/lib/libcharset.a" ] && EXTRA_LIBS="$EXTRA_LIBS -lcharset"
            echo "✅ LibASS enabled via status file (full subtitle renderer stack)"
          else
            echo "⚠️ LibASS disabled (not ready)"
          fi

          export EXTRA_LDFLAGS="-lc++_static -lc++abi $LDFLAGS"

          echo "🎯 Configuring FFmpeg n7.1 (status-driven libsoxr + rubberband + full libass stack)"
          echo "ENABLE_LIBS=$ENABLE_LIBS"
          echo "EXTRA_LIBS=$EXTRA_LIBS"

          ./configure \
            --prefix=../build/armeabi-v7a \
            --logfile=../logs/config.log \
            --arch=arm \
            --target-os=android \
            --enable-cross-compile \
            --cc=$CC \
            --cxx=$CXX \
            --strip=$STRIP \
            --ar=$AR \
            --ranlib=$RANLIB \
            --sysroot=$SYSROOT \
            --cpu=armv7-a \
            --extra-cflags="$CFLAGS -Wno-deprecated-declarations" \
            --extra-cxxflags="$CXXFLAGS" \
            --extra-ldflags="$EXTRA_LDFLAGS" \
            --extra-libs="$EXTRA_LIBS" \
            --pkg-config-flags="--static" \
            --disable-shared \
            --enable-static \
            --enable-pic \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-ffplay \
            --disable-doc \
            --disable-debug \
            --enable-optimizations \
            --enable-gpl \
            --enable-version3 \
            --enable-nonfree \
            --enable-zlib \
            --enable-bzlib \
            --enable-lzma \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libopus \
            --enable-libmp3lame \
            --enable-libvorbis \
            --enable-libwebp \
            --enable-libspeex \
            --enable-libopenjpeg \
            --enable-libfreetype \
            $ENABLE_LIBS

      - name: Build FFmpeg
        working-directory: ffmpeg
        run: |
          echo "🎯 Building FFmpeg n7.1 (COMPLETE: All codecs + LibSOXR + Rubberband filter)..."
          make -j$(nproc) V=1 2>&1 | tail -50
          make install
          cp ../build/armeabi-v7a/bin/ffmpeg ../output/armeabi-v7a/ || true
          cp ../build/armeabi-v7a/bin/ffprobe ../output/armeabi-v7a/ || true


      - name: Final Verification
        run: |
          echo "=== COMPLETE BUILD VERIFICATION (FFmpeg n7.1 + ALL Features + LibSOXR + Rubberband + Full LibASS Stack) ==="
          ls -lah output/armeabi-v7a/
          for binary in ffmpeg ffprobe; do
            if [ -f "output/armeabi-v7a/$binary" ]; then
              echo "✅ $binary: $(du -sh output/armeabi-v7a/$binary | cut -f1)"
              file output/armeabi-v7a/$binary
            else
              echo "❌ $binary: Not found"
            fi
          done
          mkdir -p release/assets/fonts release/assets/fontconfig
          cp -r output/armeabi-v7a/* release/ 2>/dev/null || echo "Binaries copied"
          cp -f build/external/etc/fonts/fonts.conf release/assets/fontconfig/fonts.conf 2>/dev/null || true
          cp -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf release/assets/fonts/ 2>/dev/null || true
          cp -f /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf release/assets/fonts/ 2>/dev/null || true
          cp -f /usr/share/fonts/truetype/noto/NotoSerif-Regular.ttf release/assets/fonts/ 2>/dev/null || true
          cp -f /usr/share/fonts/truetype/noto/NotoSansMono-Regular.ttf release/assets/fonts/ 2>/dev/null || true
          cp -f /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf release/assets/fonts/ 2>/dev/null || true
          cp -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf release/assets/fonts/ 2>/dev/null || true
          find /usr/share/fonts/opentype/noto -maxdepth 1 \( -name 'NotoSansCJK*.otf' -o -name 'NotoSerifCJK*.otf' \) -exec cp -f {} release/assets/fonts/ \; 2>/dev/null || true
          cat > release/FONTS_README.txt << 'EOF'
          Runtime font notes for this FFmpeg/libass build
          ==============================================

          1) This build enables libass + fontconfig + harfbuzz + fribidi + libunibreak.
          2) For the most reliable subtitle rendering on Android, either:
             - copy your own fonts into a directory and use:
               -vf "subtitles=sub.ass:fontsdir=/absolute/path/to/fonts"
             - or provide FONTCONFIG_FILE/FONTCONFIG_PATH with the bundled fonts.conf.
          3) Bundled fallback fonts are placed in: assets/fonts/
          4) Sample fontconfig file is placed in: assets/fontconfig/fonts.conf
          5) If you ship your own font pack, prefer Noto or the exact subtitle-assigned fonts.
          EOF
          cat > release/BUILD_INFO.txt << 'EOF'
          FFmpeg n7.1 - Complete Build (ARMv7a, Static)
          Built with: LibSOXR, Rubberband Filter, LibASS (HarfBuzz + FriBidi + Fontconfig + libunibreak)
          Extra font support: FreeType with zlib/bzip2/png and Brotli fallback logic
          Runtime assets: Noto fallback fonts bundle + sample fontconfig config
          Architecture: ARMv7a with NEON
          EOF

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-n7.1-complete-libsoxr-rubberband-libass
          path: release/
          retention-days: 30


      - name: Complete Summary
        run: |
          echo "## 🎉 FFmpeg n7.1 COMPLETE Build SUCCESS (+ Full LibASS Stack)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ NEW IN THIS BUILD:" >> $GITHUB_STEP_SUMMARY
          echo "- **LibASS v0.17.4**: Portable ASS/SSA subtitle renderer with HarfBuzz + FriBidi + Fontconfig + libunibreak" >> $GITHUB_STEP_SUMMARY
          echo "- **FreeType expanded**: zlib + bzip2 + libpng, with Brotli/WOFF2 attempt and safe fallback" >> $GITHUB_STEP_SUMMARY
          echo "- **Android runtime ready**: sample fonts.conf plus bundled Noto fallback fonts" >> $GITHUB_STEP_SUMMARY
          echo "- **Library Status File**: lib_status.env tracks libsoxr + rubberband + libass availability" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 ALL FEATURES:" >> $GITHUB_STEP_SUMMARY
          echo "- **21+ External Libraries**: Fully static compilation" >> $GITHUB_STEP_SUMMARY
          echo "- **All Video Codecs**: H.264, H.265, VP8/9, AV1, Theora" >> $GITHUB_STEP_SUMMARY
          echo "- **All Audio Codecs**: AAC, MP3, MP2, Opus, Vorbis, Speex, GSM" >> $GITHUB_STEP_SUMMARY
          echo "- **Audio Processing**: LibSOXR + Rubberband filter (time-stretch, pitch-shift)" >> $GITHUB_STEP_SUMMARY
          echo "- **Subtitle Rendering**: LibASS + HarfBuzz + FreeType + FriBidi + Fontconfig + libunibreak" >> $GITHUB_STEP_SUMMARY
          echo "- **Ready for Production**: ARMv7a optimized, NEON enabled" >> $GITHUB_STEP_SUMMARY
